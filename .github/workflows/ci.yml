# BBHub-lite CI/CD pipeline
#   Job 1 (always):           install deps, run LWC Jest tests with coverage
#   Job 2 (if secret is set): log in to the org with SFDX_AUTH_URL, then run a
#                             check-only deployment + every Apex test.
#                             "Validate" deploys nothing; it proves the code
#                             WOULD deploy, which is how banks gate releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lwc-unit-tests:
    name: LWC Jest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit:coverage

  validate-deployment:
    name: Validate deploy + Apex tests
    runs-on: ubuntu-latest
    needs: lwc-unit-tests
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for org credentials
        id: creds
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "No SFDX_AUTH_URL secret. Skipping org validation (LWC tests still ran)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22

      - name: Install Salesforce CLI
        if: steps.creds.outputs.present == 'true'
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Authenticate to org
        if: steps.creds.outputs.present == 'true'
        run: |
          # Strip any stray CR/LF/spaces (a secret saved from Windows can carry a hidden line break)
          printf '%s' "$SFDX_AUTH_URL" | tr -d '\r\n\t ' > ./authurl.txt
          sf org login sfdx-url --sfdx-url-file ./authurl.txt --alias ci-org --set-default
          rm -f ./authurl.txt
          sf org list

      - name: Validate deployment (check-only) and run Apex tests
        if: steps.creds.outputs.present == 'true'
        run: sf project deploy validate --source-dir force-app --target-org ci-org --test-level RunLocalTests --wait 30
